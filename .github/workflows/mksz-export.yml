name: MKSZ kézilabda-export

on:
  schedule:
    # UTC-ben: 6:10, 11:10, 22:10 = 7:10, 12:10, 23:10 budapesti téli idő szerint,
    # vagyis mindig fél órával a MAFC Eredményfigyelő frissítése előtt.
    - cron: '10 6,11,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node export.js
      - name: Mentés a tárolóba
        run: |
          git config user.name "mksz-export"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git diff --cached --quiet && exit 0
          git commit -m "MKSZ-export $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
