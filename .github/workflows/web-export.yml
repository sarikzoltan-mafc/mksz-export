name: Szövetségi oldalak mentése (röplabda)

on:
  schedule:
    # UTC-ben: 6:05, 11:05, 22:05 = 7:05, 12:05, 23:05 budapesti téli idő szerint,
    # a MAFC Eredményfigyelő frissítése (7:41, 12:41, 23:41) előtt.
    - cron: '5 6,11,22 * * *'
  workflow_dispatch:
    inputs:
      extra:
        description: 'Pótlólagos napok, szóközzel: hunvolley:ÉÉÉÉ-HH-NN'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: web-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node web-export.js
        env:
          EXTRA: ${{ github.event.inputs.extra }}
      - name: Mentés a web-export ágra (egyetlen commit, felülírva)
        run: |
          mkdir -p /tmp/pub && cp -r web /tmp/pub/web
          git config user.name "web-export"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan web-export-tmp
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/pub/web ./web
          git add web
          git commit -qm "Web-export $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:web-export
